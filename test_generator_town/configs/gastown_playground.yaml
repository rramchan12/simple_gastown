# Test Generator for gastown_playground
# ======================================
# Generates comprehensive tests for the gastown_playground repository
#
# Run with:
#   python -m test_generator_town configs/gastown_playground.yaml

name: gastown-playground-tests

# Path to git repository
repo_path: "Q:/workspace/gastown_playground"

# Workspace location (relative to this file)
town_root: "./tests/projects/gastown-playground"

# Task grouping name
convoy_name: "Test Generation for Gastown Playground"

# Git worktrees for isolated worker environments (provides repo context to workers)
use_worktrees: true

# Clean up previous workspace on start
cleanup_on_start: true

# Preserve worktrees after completion for inspection
preserve_worktrees: true

# LLM Configuration (auto-detects from GITHUB_TOKEN, OPENAI_API_KEY, or ANTHROPIC_API_KEY)
# llm:
#   provider: github
#   model: gpt-4o-mini

# Tasks to execute
tasks:
  - title: "Generate Unit Tests"
    description: |
      Analyze the repository and generate comprehensive unit tests.

      Instructions:
      1. Identify the main modules and their public functions/classes
      2. Create pytest-style unit tests with good coverage
      3. Include edge cases and error handling tests
      4. Use descriptive test names that explain what's being tested

      Output Python test files with proper imports and fixtures.
    priority: high
    tags:
      - unit-tests
      - pytest

  - title: "Generate Integration Tests"
    description: |
      Create integration tests that verify components work together.

      Instructions:
      1. Identify key integration points in the codebase
      2. Create tests that exercise multiple modules together
      3. Include setup and teardown for test isolation

      Output Python test files.
    priority: normal
    tags:
      - integration-tests
      - pytest
